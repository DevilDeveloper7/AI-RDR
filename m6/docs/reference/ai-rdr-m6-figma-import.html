header{height:56px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:16px;padding:0 24px;flex:none}

main{flex:1;padding:24px}.screen{display:block;max-width:1240px;margin:0 auto}

.note{background:var(--surface-secondary);border-radius:var(--r);padding:12px;color:var(--text-secondary)}

textarea{width:100%;min-height:70px;border:1px solid var(--border);border-radius:var(--r);padding:8px;font:inherit;resize:vertical}

.modal{background:var(--surface);border-radius:10px;max-width:440px;width:100%;padding:22px;box-shadow:0 12px 40px rgba(0,0,0,.2)}.modal h3{margin:0 0 6px;font-size:17px}.modal .acts{justify-content:flex-end;margin-top:18px}

 modal(`<h3 id="mt">Confirm Kill and Isolate?</h3><p class="mut">Verification will be treated as confirmed. The process is killed and ${a.host} is isolated from the network.</p><div class="acts"><button class="btn" onclick="closeM()">Cancel</button><button class="btn p" onclick="confirmKill()">Confirm Kill / Isolate</button></div>`)}
function confirmKill(){const a=al();a.resp='Isolated';a.ver='Confirmed';a.ack=true;closeM();ACT.unshift([now(),'Kill + Isolate',a.host+' · A. Khan',a.id]);toast(a.host+' isolated');render()}
function runCheck(i){I[i][5]=now();if(I[i][0]==='M5')I[i][4]='Connected';toast(I[i][0]+' check complete: '+I[i][4]);render()}

const openN=()=>A.filter(a=>!a.ack).length;
function tbl(rows){return rows}
const ORDER=[['dashboard','01 · Dashboard',rDash],['alert-detail','02 · Alert Detail',rDetail],['shap','03 · SHAP Explanation',rShap],['honey','04 · Honey-File Status',rHoney],['intel','05 · Threat Intelligence',rIntel],['action','06 · Action / Override',rAction],['integrations','07 · Integration Status',rInt]];
function shell(k,label,body){const g=GROUP[k]||k,n=openN();
 return `<div class="fwrap" id="f-${k}"><div class="flabel">${label}</div><div class="frame" data-screen="SCREEN-${label.replace(' · ','-').replace(/[ \/]+/g,'-')}">
<aside aria-label="Primary"><div class="logo"><i>${ic('shield')}</i><div>AI-RDR<small>Ransomware Detection &amp; Response</small></div></div>
<nav>${NAV.map(([x,l,i])=>`<button class="${g===x?'on':''}" ${g===x?'aria-current="page"':''} onclick="go('${x}')">${ic(i)}${l}</button>`).join('')}</nav>
<div class="sb-foot"><div class="okl">${ic('check-circle')}All core services online</div><div class="who"><span class="av">AK</span><div>A. Khan<br><span class="mut">SOC Analyst</span></div></div></div></aside>
<div class="main"><header><h1>${TITLES[k]}</h1><span class="env">Production  ·  Linux fleet</span>
<label class="search">${ic('search')}<input aria-label="Search" placeholder="Search alerts, hosts, indicators" onkeydown="if(event.key==='Enter')toast('Search is not wired in this prototype')"></label>
<button class="bell" aria-label="Notifications" onclick="go('dashboard')">${ic('bell')}${n?`<b>${n}</b>`:''}</button></header>
<main><section class="screen" id="s-${k}">${body}</section></main></div></div></div>`}
const BI={Critical:'alert',High:'alert',Medium:'alert',TRIGGERED:'alert',Malicious:'alert',Warning:'alert',Frozen:'pause',Isolated:'ban',Thawed:'check',Running:'check',Acknowledged:'check',Connected:'check',Clean:'check',Suspicious:'warn2',Unknown:'help',Protected:'globe',Open:'clock',Stubbed:'minus',Failed:'xc'};
function tagIcons(){document.querySelectorAll('.tag').forEach(e=>{if(e.querySelector('svg'))return;const k=Object.keys(BI).find(x=>e.textContent.trim().startsWith(x));if(k)e.insertAdjacentHTML('afterbegin',ic(BI[k]))})}
function tagFlows(){document.querySelectorAll('[onclick]').forEach(e=>{const m=/(go|pick)\('([^']+)'/.exec(e.getAttribute('onclick'));if(!m)return;const t=m[1]==='go'?m[2]:'alert-detail';e.setAttribute('data-flow-target',t);e.setAttribute('data-figma-name','Hotspot → '+t)})}
function render(){const y=window.scrollY;$('stack').innerHTML=ORDER.map(([k,l,f])=>shell(k,l,f())).join('');tagFlows();tagIcons();window.scrollTo(0,y)}

function head(t,sub,btns='',back){return`<div>${back?`<button class="back" onclick="go('${back[0]}')">${ic('back')}${back[1]}</button>`:''}</div><div class="ph"><div><h2>${t}</h2><p>${sub}</p></div><div class="sp">${btns}</div></div>`}

function rDash(){const crit=A.filter(a=>a.sev==='Critical'&&a.resp!=='Thawed').length,act=A.filter(a=>a.resp==='Frozen').length;
 return head('Dashboard','Monitoring active · last telemetry received 09:44:03','<span class="mut" style="padding-top:6px">Monitoring active</span>')+
 `<div class="grid"><div class="c3">${stat('Active Alerts',act,'')}</div><div class="c3">${stat('Critical Alerts',crit,'crit')}</div><div class="c3">${stat('Honey Files',H.length+' · 2 triggered')}</div><div class="c3">${stat('Systems Monitored','6 of 6 hosts')}</div>
 <div class="card c12"><h3>Live Alert Feed<span>Select an alert to investigate</span></h3><div class="tw"><table><thead><tr><th>Severity</th><th>Detection</th><th>Time</th><th>Host</th><th>Process / activity</th><th>State</th></tr></thead><tbody>${A.map(a=>`<tr class="row ${a.id===S.sel?'sel':''}" tabindex="0" onclick="pick('${a.id}')" onkeydown="if(event.key==='Enter')pick('${a.id}')"><td>${sev(a.sev)}</td><td>${a.type}<div class="mut mono">${a.id}</div></td><td class="mono">${a.ts}</td><td>${a.host}</td><td class="mono">${a.proc}</td><td>${stTag(a)}${a.ack?'':' <span class="tag gr">Open</span>'}</td></tr>`).join('')}</tbody></table></div></div>
 <div class="card c6"><h3>Honey-File Status<span><a href="#" onclick="go('honey');return false" style="color:var(--primary-red-dark)">View all</a></span></h3><div class="pad"><dl><dt>Monitored hosts</dt><dd>6</dd><dt>Healthy files</dt><dd>4</dd><dt>Triggered files</dt><dd><b style="color:var(--primary-red)">2</b> (HOST-02, HOST-03)</dd><dt>Last activity</dt><dd class="mono">09:41:15 · HOST-03</dd><dt>Watcher (inotify)</dt><dd><span class="tag ok">Running</span></dd></dl></div></div>
 <div class="card c6"><h3>Threat Intelligence Context<span>Enrichment only</span></h3><div class="tw"><table><thead><tr><th>Indicator</th><th>Type</th><th>Reputation</th><th>Checked</th></tr></thead><tbody>${T.slice(0,4).map((t,i)=>`<tr class="row" onclick="S.ti=${i};go('intel')"><td class="mono">${t.v}</td><td>${t.t}</td><td>${repTag(t.rep)}</td><td class="mono">${t.chk}</td></tr>`).join('')}</tbody></table></div></div>
 <div class="card c12"><h3>Recent Response Activity</h3><div class="pad"><ul class="tl">${ACT.slice(0,6).map((r,i)=>`<li class="${i<1?'hot':''}"><time class="mono">${r[0]}</time><span><b>${r[1]}</b> <span class="mut">· ${r[2]} · ${r[3]}</span></span></li>`).join('')}</ul></div></div></div>`}

function steps(a){const o=['Freeze','Verify','Kill / Isolate'];let c=a.resp==='Isolated'?3:a.resp==='Thawed'?-1:1;
 return`<div class="steps">${o.map((s,i)=>`<span class="${c===-1?(i<2?'done':''):i<c?'done':i===c?'cur':''}">${s}</span>`).join('')}${a.resp==='Thawed'?'<span class="cur">Thaw</span>':''}</div>`}
function rDetail(){const a=al(),m=a.ml,t=a.ts.slice(0,5);
 const ev=m?[['write_rate','1,840 writes/s (baseline 42)'],['rename_ratio','0.61 of file operations'],['syscall_frequency','12.4k/s (auditd)'],['FIM','312 files modified in 9 s under /home/shared/']]:[['Trigger','Honey file opened / modified (inotify)'],['File',a.file],['Event','IN_MODIFY, IN_OPEN by PID 4127'],['Model stage','Bypassed (fast path)']];
 const tl=m?[['09:41:12','Telemetry received'],['09:41:14','Behavioural anomaly detected'],['09:41:15','ML threshold exceeded'],['09:41:15','Process frozen'],['09:41:16','Verification started'],['pending','Isolation, if verification confirms']]:[[a.ts.slice(0,7)+'0','Honey-file event received (inotify)'],[a.ts,'Fast-path alert created'],[a.ts,'Process frozen'],[a.ts.slice(0,7)+'6','Verification started'],['pending','Isolation, if verification confirms']];
 return head('Alert '+a.id,a.type+' · '+a.host,'',['dashboard','Dashboard'])+
 `<div class="grid"><div class="card c8"><div class="sec"><dl><dt>Severity</dt><dd>${sev(a.sev)}</dd><dt>Detection method</dt><dd>${a.type}</dd><dt>Timestamp</dt><dd class="mono">2026-09-29 ${a.ts}</dd><dt>Affected host</dt><dd>${a.host}</dd><dt>Process</dt><dd class="mono">${a.proc}</dd><dt>Status</dt><dd><span class="tag ${a.ack?'ok':'gr'}">${a.ack?'Acknowledged':'Open'}</span></dd></dl></div>
 <div class="sec"><h4>Detection summary</h4><p style="margin:0">${m?`Behavioural activity on ${a.host} exceeded the configured ransomware detection threshold. The process wrote and renamed files at a rate far above baseline.`:`A honey file on ${a.host} was accessed. Honey-file interaction is a high-confidence signal and was sent directly to response without ML scoring.`}</p></div>
 <div class="sec"><h4>Evidence</h4><dl>${ev.map(e=>`<dt class="mono">${e[0]}</dt><dd class="mono">${e[1]}</dd>`).join('')}</dl></div>
 <div class="sec"><h4>Timeline</h4><ul class="tl">${tl.map((r,i)=>`<li class="${r[0]==='pending'?'pend':i===3||i===2&&!m?'hot':''}"><time class="mono">${r[0]==='pending'?'—':r[0]}</time><span class="${r[0]==='pending'?'mut':''}">${r[1]}</span></li>`).join('')}</ul></div></div>
 <div class="c4" style="display:flex;flex-direction:column;gap:16px"><div class="card"><h3>Response status</h3><div class="pad">${stTag(a)}<p class="mut" style="margin:10px 0">Workflow: Freeze → Verify → Kill/Isolate, or Thaw if false positive.</p>${steps(a)}</div></div>
 <div class="card"><h3>Actions</h3><div class="pad acts"><button class="btn p" ${a.ack?'disabled':''} onclick="ack('${a.id}')">${ic('check')}${a.ack?'Acknowledged':'Acknowledge'}</button><button class="btn" onclick="${m?"go('shap')":"toast('SHAP applies to ML detections only')"}">${ic('chart')}View SHAP explanation</button><span style="flex-basis:100%;border-top:1px solid var(--border)"></span><button class="btn d" onclick="go('action')">Override response…</button></div></div></div></div>`}

function rShap(){const a=al().ml?al():A[1];
 const F=[['write_rate',.42],['rename_ratio',.27],['syscall_frequency',.21],['file_operation_rate',.15],['process_activity',.09],['user_session_age',-.06],['known_backup_process',-.11]];
 const mx=.5;
 return head('Detection Explanation','SHAP explanation for '+a.id+' · '+a.host,'',['alert-detail','Alert '+a.id])+
 `<div class="grid"><div class="card c8"><h3>Feature contributions<span>SHAP value · impact on model output</span></h3><div class="pad">${F.map(([f,v])=>`<div class="bar"><span class="mono">${f}</span><div class="t"><span style="position:absolute;left:50%;top:-2px;bottom:-2px;border-left:1px solid #bbb"></span><i style="${v>0?'left:50%':'right:50%'};width:${Math.abs(v)/mx*50}%;background:${v>0?'var(--primary-red)':'#6B7280'}"></i></div><b class="mono">${v>0?'+':'−'}${Math.abs(v).toFixed(2)}</b></div>`).join('')}
 <p class="mut" style="margin:14px 0 0;font-size:12px"><span class="lg"><i style="background:var(--primary-red)"></i>Increases likelihood</span><span class="lg"><i style="background:#6B7280"></i>Reduces likelihood</span></p></div>
 <div class="sec" style="border-top:1px solid var(--border)"><h4>Explanation</h4>The alert was primarily influenced by unusually high file-write activity and elevated rename operations. Backup-process similarity slightly reduced confidence.</div></div>
 <div class="c4" style="display:flex;flex-direction:column;gap:16px"><div class="card"><h3>Model output</h3><div class="stat"><small>Ransomware likelihood</small><b class="" style="color:var(--primary-red)">94%</b></div></div>
 <div class="card"><h3>Details</h3><div class="pad"><dl style="grid-template-columns:100px 1fr"><dt>Model</dt><dd>XGBoost</dd><dt>Alert ID</dt><dd class="mono">${a.id}</dd><dt>Severity</dt><dd>${sev(a.sev)}</dd><dt>Explained at</dt><dd class="mono">09:41:15</dd><dt>Top feature</dt><dd class="mono">write_rate</dd></dl></div></div></div></div>`}

function rHoney(){return head('Honey Files','Deception path · interaction is treated as a high-confidence alert')+
 `<div class="grid"><div class="c3">${stat('Watcher','Running')}</div><div class="c3">${stat('Honey files',H.length)}</div><div class="c3">${stat('Triggered','2','crit')}</div><div class="c3">${stat('Last interaction','09:41:15')}</div>
 <div class="card c8"><h3>Monitored honey files<span>inotify: active on 6 of 6 hosts</span></h3><div class="tw"><table><thead><tr><th>Host</th><th>Honey file</th><th>Location</th><th>Status</th><th>Last event</th><th>Action</th></tr></thead><tbody>${H.map((h,i)=>{const t=h[3]==='Triggered',al2=A.find(a=>!a.ml&&a.host===h[0]);return`<tr class="row ${S.hf===i?'sel':''}" onclick="S.hf=${i};render()"><td>${h[0]}</td><td class="mono">${h[1]}</td><td class="mono">${h[2]}</td><td>${t?'<span class="tag crit">'+ic('alert')+'TRIGGERED</span>':'<span class="tag ok">Protected</span>'}</td><td class="mono">${h[4]}</td><td>${t?`<button class="btn" onclick="event.stopPropagation();pick('${al2.id}')">Alert created</button>`:'—'}</td></tr>`}).join('')}</tbody></table></div></div>
 <div class="card c4"><h3>Recent activity</h3><div class="pad"><ul class="tl"><li class="hot"><time class="mono">09:41:15</time><span>budget_report.docx modified on HOST-03</span></li><li><time class="mono">08:10:02</time><span>payroll_q3.xlsx opened on HOST-02</span></li><li><time class="mono">06:00:00</time><span class="mut">Integrity check passed, 6 hosts</span></li></ul>${S.hf!=null?`<div class="note">Selected: <b>${H[S.hf][1]}</b> on ${H[S.hf][0]}, ${H[S.hf][2]}</div>`:''}</div></div></div>`}

function rIntel(){const t=T[S.ti];return head('Threat Intelligence','Enrichment context attached to alerts. Not used for the detection decision.')+
 `<div class="grid"><div class="card c8"><h3>Indicators</h3><div class="tw"><table><thead><tr><th>Indicator</th><th>Type</th><th>Reputation</th><th>Source</th><th>Related alert</th><th>Checked</th></tr></thead><tbody>${T.map((x,i)=>`<tr class="row ${i===S.ti?'sel':''}" tabindex="0" onclick="S.ti=${i};render()" onkeydown="if(event.key==='Enter'){S.ti=${i};render()}"><td class="mono">${x.v}</td><td>${x.t}</td><td>${repTag(x.rep)}</td><td>${x.src}</td><td class="mono">${x.al}</td><td class="mono">${x.chk}</td></tr>`).join('')}</tbody></table></div></div>
 <div class="card c4"><h3>Indicator detail</h3><div class="pad"><dl style="grid-template-columns:100px 1fr"><dt>Value</dt><dd class="mono" style="word-break:break-all">${t.v}</dd><dt>Type</dt><dd>${t.t}</dd><dt>Reputation</dt><dd>${repTag(t.rep)}</dd><dt>Source</dt><dd>${t.src}</dd><dt>Alert</dt><dd class="mono">${t.al}</dd></dl><div class="note" style="margin:14px 0">${t.n}</div><button class="btn" onclick="pick('${t.al}')">Open alert ${t.al}</button></div></div></div>`}

function rAction(){const a=al(),fin=a.resp!=='Frozen';return head('Response Actions','Acknowledge or override the automatic response','',['alert-detail','Alert '+a.id])+
 `<div class="grid"><div class="card c5"><h3>Alert summary</h3><div class="pad"><dl style="grid-template-columns:120px 1fr"><dt>Alert</dt><dd class="mono">${a.id}</dd><dt>Severity</dt><dd>${sev(a.sev)}</dd><dt>Host</dt><dd>${a.host}</dd><dt>Process</dt><dd class="mono">${a.proc}</dd><dt>Automatic action</dt><dd><b>${a.resp==='Frozen'?'Process frozen':a.resp}</b></dd><dt>Current state</dt><dd>${a.resp==='Frozen'?'Verification in progress':a.ver}</dd></dl><div style="margin-top:14px">${steps(a)}</div></div></div>
 <div class="c7" style="display:flex;flex-direction:column;gap:16px"><div class="opt"><b>Acknowledge</b><span class="mut">Confirms you have seen this alert. The automatic response continues unchanged.</span><div><button class="btn p" ${a.ack?'disabled':''} onclick="ack('${a.id}')">${a.ack?'Acknowledged':'Acknowledge alert'}</button></div></div>
 <div class="opt dz"><b>Override automatic response</b><dl style="grid-template-columns:130px 1fr"><dt>Current action</dt><dd>${a.resp}</dd><dt>Proposed action</dt><dd>Thaw (release process, treat as false positive)</dd></dl><label for="why" class="mut">Reason (required)</label><textarea id="why" placeholder="e.g. Scheduled backup job, verified with host owner"></textarea><label class="mut"><input type="checkbox" id="cf" onchange="$('ob').disabled=!this.checked||$('why').value.length<3||${fin}"> I confirm I am authorised to override this response.</label><div class="acts"><button class="btn d" id="ob" disabled onclick="askOverride()">Override…</button><span class="sep"></span><button class="btn" ${fin?'disabled':''} onclick="killIso()">Confirm Kill / Isolate</button></div>${fin?'<span class="mut">Response is final for this alert.</span>':''}</div></div></div>`}

function rInt(){return head('Integration Status','Interface contracts between modules','<button class="btn" onclick="I.forEach((_,i)=>I[i][5]=now());toast(\'All contract checks complete\');render()">Run all checks</button>')+
 `<div class="grid"><div class="card c12"><h3>Components</h3><div class="tw"><table><thead><tr><th>Component</th><th>Interface</th><th>Endpoint</th><th>Status</th><th>Last check</th><th></th></tr></thead><tbody>${I.map((r,i)=>`<tr><td><b>${r[0]}</b> <span class="mut">${r[1]}</span></td><td>${r[2]}</td><td class="mono">${r[3]}</td><td><span class="tag ${{Connected:'ok',Stubbed:'info',Warning:'high',Failed:'crit'}[r[4]]}">${r[4]}</span></td><td class="mono">${r[5]}</td><td><button class="btn" onclick="runCheck(${i})">Check</button></td></tr>`).join('')}</tbody></table></div></div>
 <div class="card c12"><h3>Integration test<span>Last run 09:40</span></h3><div class="tw"><table><tbody>${TESTS.map(t=>`<tr><td><b>${t[0]}</b></td><td>${t[1]}</td><td>${t[2]}</td><td class="mono mut">${t[3]}</td></tr>`).join('')}</tbody></table></div></div></div>`}

render();
</script>
</body>
</html>
