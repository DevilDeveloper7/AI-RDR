---
# AI-RDR capstone project — stores the real VirusTotal API key (task 4.3's
# live threat-intel source; IBM X-Force's free tier is confirmed gone, see
# planning/threat-intel-spec.md) into Infisical, following this project's
# standing "generate/obtain, push straight to Infisical, never write it to
# the repo or a task log" discipline (setup_airdr_arm_executor.yml,
# setup_airdr_irdp_writer.yml).
#
# The key itself was created by the project owner directly on
# virustotal.com (an account-creation action that stays with the user, per
# this project's standing credential boundary) and handed to this playbook
# only as a Semaphore Environment variable — never as a -e/CLI argument
# (which Semaphore logs in plaintext in task history) and never committed
# to this repo.
#
# This playbook ONLY stores the credential in Infisical. It deliberately
# does NOT fetch it into airdr-detect's environment or wire it into
# run_irdp.py — that's Phase B of task 4.3 (planning/threat-intel-progress.md),
# gated on fixing two disclosed gaps in CachedThreatIntelClient/
# OpenSearchThreatIntelCache first (neither catches a cache-backend failure
# yet, which would currently crash IRDP's poll cycle instead of degrading).
#
# Requires (via the Semaphore Environment attached to this template, same
# "AI-RDR Infisical (airdr-siem-agent)" identity already used by sibling
# credential playbooks):
#   INFISICAL_PROJECT_ID, INFISICAL_CLIENT_ID, INFISICAL_CLIENT_SECRET,
#   VIRUSTOTAL_API_KEY_RAW (the real key, added just for this one run)
#
# Usage:
#   ansible-playbook playbooks/ubuntu/setup_airdr_threat_intel_credential.yml --limit airdr-detect

- name: Push the VirusTotal API key to Infisical
  hosts: airdr-detect
  become: true
  gather_facts: false

  vars:
    infisical_address: "https://infisical.example.com"
    infisical_env: "prod"
    infisical_secret_path: "/threat-intel-credentials"
    provision_script_path: /root/.push_threat_intel_credential.sh

  tasks:
    - name: Fail fast if required Semaphore Environment vars aren't set
      ansible.builtin.assert:
        that:
          - infisical_project_id_var is defined
          - infisical_client_id_var is defined
          - infisical_client_secret_var is defined
          - virustotal_key_var is defined
        fail_msg: >-
          INFISICAL_PROJECT_ID / INFISICAL_CLIENT_ID / INFISICAL_CLIENT_SECRET /
          VIRUSTOTAL_API_KEY_RAW must be set via this template's Semaphore
          Environment (Extra Variables) — never as -e/CLI args.
      vars:
        infisical_project_id_var: "{{ INFISICAL_PROJECT_ID | default(omit) }}"
        infisical_client_id_var: "{{ INFISICAL_CLIENT_ID | default(omit) }}"
        infisical_client_secret_var: "{{ INFISICAL_CLIENT_SECRET | default(omit) }}"
        virustotal_key_var: "{{ VIRUSTOTAL_API_KEY_RAW | default(omit) }}"

    - name: Write the push script (the key never touches this playbook's own stdout/log)
      ansible.builtin.copy:
        dest: "{{ provision_script_path }}"
        mode: "0700"
        owner: root
        group: root
        content: |
          #!/usr/bin/env bash
          set -euo pipefail

          INFISICAL_ADDRESS="{{ infisical_address }}"
          INFISICAL_ENV_SLUG="{{ infisical_env }}"
          INFISICAL_SECRET_PATH="{{ infisical_secret_path }}"
          INFISICAL_FOLDER_NAME="{{ infisical_secret_path | regex_replace('^/', '') }}"

          : "${INFISICAL_PROJECT_ID:?missing}"
          : "${INFISICAL_CLIENT_ID:?missing}"
          : "${INFISICAL_CLIENT_SECRET:?missing}"
          : "${VIRUSTOTAL_API_KEY_RAW:?missing}"

          infisical_login() {
            local resp token
            resp=$(curl -s -X POST "${INFISICAL_ADDRESS}/api/v1/auth/universal-auth/login" \
              -H "Content-Type: application/json" \
              -d "$(python3 -c 'import json,sys; print(json.dumps({"clientId": sys.argv[1], "clientSecret": sys.argv[2]}))' "$INFISICAL_CLIENT_ID" "$INFISICAL_CLIENT_SECRET")" 2>/dev/null)
            token=$(echo "$resp" | python3 -c 'import sys,json; print(json.load(sys.stdin)["accessToken"])' 2>/dev/null)
            echo "$token"
          }

          access_token=$(infisical_login)
          if [ -z "$access_token" ]; then
            echo '{"status":"error","reason":"infisical universal-auth login failed - credential was NOT pushed"}'
            exit 1
          fi

          set +e
          curl -s -o /dev/null -X POST "${INFISICAL_ADDRESS}/api/v1/folders" \
            -H "Authorization: Bearer ${access_token}" -H "Content-Type: application/json" \
            -d "$(python3 -c 'import json,sys; print(json.dumps({"workspaceId": sys.argv[1], "environment": sys.argv[2], "name": sys.argv[3], "path": "/"}))' "$INFISICAL_PROJECT_ID" "$INFISICAL_ENV_SLUG" "$INFISICAL_FOLDER_NAME")"
          set -e

          secrets_body=$(VT_KEY="$VIRUSTOTAL_API_KEY_RAW" python3 - "$INFISICAL_SECRET_PATH" "$INFISICAL_ENV_SLUG" "$INFISICAL_PROJECT_ID" <<'PYEOF'
          import json
          import os
          import sys

          secret_path, env_slug, project_id = sys.argv[1:4]
          body = {
              "workspaceId": project_id,
              "environment": env_slug,
              "secretPath": secret_path,
              "secrets": [
                  {"secretKey": "VIRUSTOTAL_API_KEY", "secretValue": os.environ["VT_KEY"]},
              ],
          }
          print(json.dumps(body))
          PYEOF
          )

          # POST creates (400 "Secret already exist" if this path was already populated -
          # e.g. a key rotation); PATCH updates in that case. Same idempotency fix already
          # applied to the sibling irdp-writer/arm-opensearch playbooks after hitting this bug.
          http_code=$(curl -s -o /root/.threat_intel_infisical_resp.log -w '%{http_code}' \
            -X POST "${INFISICAL_ADDRESS}/api/v3/secrets/batch/raw" \
            -H "Authorization: Bearer ${access_token}" \
            -H "Content-Type: application/json" \
            -d "$secrets_body")

          if [ "$http_code" = "400" ] && grep -q 'Secret already exist' /root/.threat_intel_infisical_resp.log; then
            http_code=$(curl -s -o /root/.threat_intel_infisical_resp.log -w '%{http_code}' \
              -X PATCH "${INFISICAL_ADDRESS}/api/v3/secrets/batch/raw" \
              -H "Authorization: Bearer ${access_token}" \
              -H "Content-Type: application/json" \
              -d "$secrets_body")
          fi

          if [ "$http_code" != "200" ]; then
            echo '{"status":"error","reason":"infisical push failed (http '"$http_code"') - see /root/.threat_intel_infisical_resp.log"}'
            exit 1
          fi
          rm -f /root/.threat_intel_infisical_resp.log
          echo '{"status":"success","secret_path":"'"$INFISICAL_SECRET_PATH"'","secret_key":"VIRUSTOTAL_API_KEY"}'

    - name: Push the credential to Infisical
      ansible.builtin.command: "bash {{ provision_script_path }}"
      environment:
        INFISICAL_PROJECT_ID: "{{ INFISICAL_PROJECT_ID }}"
        INFISICAL_CLIENT_ID: "{{ INFISICAL_CLIENT_ID }}"
        INFISICAL_CLIENT_SECRET: "{{ INFISICAL_CLIENT_SECRET }}"
        VIRUSTOTAL_API_KEY_RAW: "{{ VIRUSTOTAL_API_KEY_RAW }}"
      register: push_result
      changed_when: "'\"status\":\"success\"' in push_result.stdout"
      no_log: true

    - name: Fail loudly if the push failed
      ansible.builtin.fail:
        msg: "VirusTotal credential push failed: {{ push_result.stdout }}"
      when: "'\"status\":\"success\"' not in push_result.stdout"

    - name: Remove the push script (contained no secret, but clean up anyway)
      ansible.builtin.file:
        path: "{{ provision_script_path }}"
        state: absent

    - name: Confirm what was stored (for audit — no secret value shown)
      ansible.builtin.debug:
        msg:
          infisical_path: "{{ infisical_secret_path }}"
          secret_key: "VIRUSTOTAL_API_KEY"
          note: "Stored only — NOT yet fetched into airdr-detect's env or wired into run_irdp.py (Phase B, separate task)."
